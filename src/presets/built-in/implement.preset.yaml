# Work you've already worked out: main-flow from its implement stage, on the
# issue refs, the prompt or both. Refs run main-flow's ticket loop, one
# session per ticket; a prompt alone is one implement run. Review and a PR
# follow. At L1 open-pr is skipped: the operator's Push & open draft PR
# makes it (ADR 0007).
description: Implement issues or a prompt unattended, one ticket per session, then a review and a PR.
extends: main-flow
from: implement
stages:
  - id: implement
    args: "{{artifacts.tickets}} {{prompt}}"
